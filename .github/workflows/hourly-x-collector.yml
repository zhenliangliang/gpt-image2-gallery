name: Hourly X Collector (gpt-image-2)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: hourly-x-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch from X API
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DEFAULT_SEARCH_QUERY: ${{ vars.DEFAULT_SEARCH_QUERY }}
        run: npm run collect:fetch-live-gpt-image-2:x

      - name: Sync manifest + prompt.md
        run: npm run collect:live-gpt-image-2:x

      - name: Commit updates (if any)
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/collected/live-gpt-image-2
            git add public/collected/live-gpt-image-2/manifest.json
            git commit -m "chore: hourly collect live gpt-image-2"
            git push
          else
            echo "No changes."
          fi

